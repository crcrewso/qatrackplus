{% load i18n %}
{% load qa_tags %}
{% if action == "perform" and perms.qa.add_testlistinstance %}
    <a class="btn btn-default btn-xs btn-flat"
      href="{% url 'perform_qa' utc.pk %}?day=next&next={{request.path|cut:"data/"}}"
      title="{% blocktrans with utcname=utc.name unitname=utc.unit.name %}Perform {{ utcname }} for Unit {{ unitname }}{% endblocktrans %}">
      {% trans "Perform" %}
    </a>
{% elif action == "review" and perms.qa.can_view_completed %}
    <a class="btn btn-default btn-xs btn-flat"
      href="{% url 'review_utc' utc.pk %}?next={{request.path|cut:"data/"}}"
      title="{% blocktrans with utcname=utc.name unitname=utc.unit.name %}Review historical data for {{ utcname }} from Unit {{ unitname }}{% endblocktrans %}"
      >
      {% trans "History" %}
    </a>
{% endif %}
