server {
    listen 80;
    charset utf-8;

    location /static/ {
        alias /usr/src/qatrackplus/qatrack/static/;
    }

    location /media/ {
        alias /usr/src/qatrackplus/qatrack/media/;
    }

    location / {
        # Re-resolve django's address instead of pinning it at start-up.
        #
        # With a literal `proxy_pass http://django:8000`, nginx resolves the
        # name once when it loads its configuration and keeps that address for
        # the life of the process. `docker compose up -d` on an existing
        # install recreates django - which gives it a new address - while
        # leaving nginx running whenever the nginx image has not changed, so
        # nginx goes on dialling the old address and every request answers 502
        # until someone restarts it. `depends_on: {restart: true}` does not
        # cover it: compose does not restart nginx when a dependency is
        # recreated.
        #
        # 127.0.0.11 is Docker's embedded DNS server, which resolves service
        # names on the compose network. Naming the upstream through a variable
        # is what makes nginx honour the resolver's TTL rather than caching the
        # address forever. There is no URI part in the variable, so the request
        # URI is passed through unchanged, exactly as before.
        #
        # valid=10s means up to ten seconds of stale address after django moves.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
