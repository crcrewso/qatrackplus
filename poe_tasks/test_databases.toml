# ==========================================================================
# Throwaway database servers for the per-engine test runs
# ==========================================================================
#
# `poe test-engine postgres` needs a postgres to talk to. These bring the
# servers up and down so that is one command rather than a docker invocation
# nobody remembers. `poe test-engine <engine> --docker` does the `up`, the
# settings template and the run in one go; these exist for when you want the
# servers without a run, or want them gone.
#
# --wait is the point of `up`: SQL Server accepts connections roughly a
# minute after the container starts, and without it the command returns
# while the server is still initialising, so the first test run fails for
# reasons that have nothing to do with the code.
#
# The servers keep nothing. Every service runs on tmpfs with no volume, so
# `down` leaves nothing behind and a fresh `up` is a clean slate. `up` with no
# argument starts all three, which is minutes and gigabytes of SQL Server to
# test PostgreSQL; the argument makes it one.
#
# up, down and status are three jobs, exactly the verbs docker compose uses,
# so they are three tasks and not one task with a mode argument.

[tasks.test-databases-up]
help = "Start throwaway database servers and wait until they answer: poe test-databases-up [postgres|mysql|mssql], all three if omitted"
cmd = "python -m poe_tasks databases-up ${engine}"

[[tasks.test-databases-up.args]]
name = "engine"
positional = true
choices = ["postgres", "mysql", "mssql"]
help = "Which one to start; omit it for all three"

[tasks.test-databases-down]
help = "Stop throwaway database servers and remove their containers: poe test-databases-down [postgres|mysql|mssql], all three if omitted"
cmd = "python -m poe_tasks databases-down ${engine}"

[[tasks.test-databases-down.args]]
name = "engine"
positional = true
choices = ["postgres", "mysql", "mssql"]
help = "Which one to stop; omit it to take them all down"

[tasks.test-databases-status]
help = "Show whether the throwaway database servers are up, and on which ports"
cmd = "docker compose -f deploy/dev/compose.test-databases.yaml ps"
