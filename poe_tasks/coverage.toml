# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Coverage
# ==========================================================================
#
# One task where there were four. `cover`, `cover-qatrack`, `cover-module <m>`
# and `cover-mo` were one job with a scope and a report option, and the four
# copies had drifted (`cover-module` alone lacked --reuse-db). Scope and report
# detail are parameters, so they are arguments now:
#
#     poe cover                          # the suite, coverage of everything
#     poe cover qatrack                  # coverage of the qatrack package
#     poe cover qatrack/units            # one module: its tests, its coverage
#     poe cover --skip-covered           # leave fully-covered files out
#     poe cover qatrack/qa -k test_x     # anything else goes to pytest
#
# The task declares NO poe arguments, on purpose: a task that declares one
# refuses undeclared ones unless they follow `--`, and this is the task people
# filter most. poe_tasks/cli.py parses path and --skip-covered itself and hands
# everything else to pytest. The cost is that `poe cover --help` cannot
# describe the two arguments; this help line does.
#
# The path is a filesystem path, not a dotted module: it goes to both --cov and
# pytest, and pytest given `qatrack.qa` collects nothing and exits 4, which
# looks far too much like a module with no tests.
#
# The Makefile's `cover`, `cover-qatrack`, `cover-module` and `cover-mo` keep
# their spellings through the make-* mirrors, each a `ref` to this task with
# the matching arguments.
[tasks.cover]
help = "Run the suite with coverage: poe cover [path] [--skip-covered] [pytest flags]"
cmd = "python -m poe_tasks cover"
