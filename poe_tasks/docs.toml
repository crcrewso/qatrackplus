# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Documentation
# ==========================================================================


[tasks.docs]
help = "Build the Sphinx docs, failing on any warning (output under docs/_build/html)"
# `make-docs` runs `cd docs && make html`, which needs Make on the host -
# precisely what a Windows contributor does not have. Calling sphinx-build
# directly needs neither Make nor docs/make.bat.
#
# -W turns warnings into errors, which is only usable because the tree builds
# with none; a broken cross-reference or a short title underline now fails
# instead of scrolling past. --keep-going reports every warning rather than
# stopping at the first, so one run tells you everything to fix.
#
# -a --fresh-env, because an incremental build does not re-report warnings for
# files it has not reparsed: without them a second run looks clean whether or
# not it is, which is exactly how these accumulated.
cmd = "sphinx-build -W --keep-going -a --fresh-env -b html docs docs/_build/html"


[[tasks.docs-serve.args]]
name = "port"
options = ["--port"]
default = "8008"


# Named for what it does, not for the tool: this runs `sphinx-autobuild`, and
# "autobuild" was that tool's name rather than the job's. poe's own project
# calls the same task `docs-serve`. `make docs-autobuild` keeps its spelling,
# through the `make-docs-autobuild` mirror.
[tasks.docs-serve]
help = "Serve the docs locally with live-reload, default port 8008 (poe docs-serve --port 8010 to override)"
cmd = "sphinx-autobuild docs docs/_build/html --port ${port}"


# RELEASE TASK. The schema diagram is distributed documentation, regenerated
# as part of a release check - not something an ordinary PR should update. The
# output path is gitignored so that running this to *look* at the schema does
# not quietly stage a 6000-line SVG into an unrelated branch; adding one for a
# new minor line is a deliberate `git add -f`.
#
# Named for the MINOR line, read from the installed package metadata (it used
# to live in three places that disagreed, so `poe schema` and `make schema`
# wrote different files). Rendered to a staged file inside docs/developer/
# images/ and moved into place only if the render worked: django-extensions
# falls back to pydotplus when pygraphviz is missing, and pydotplus writes a
# zero-byte file and exits 0, which is how the Makefile's target destroyed the
# committed 838 KB diagram and reported success. The details are on `schema`
# in poe_tasks/cli.py.
[tasks.schema]
help = "RELEASE: regenerate the distributed schema diagram (see docs/developer/schema.rst)"
cmd = "python -m poe_tasks schema"


# `check-messages` in poe_tasks/translations.toml was once a Python body here
# that parsed msgfmt's --statistics output, and it had two faults @nsmela found
# on #868: msgfmt translates that prose, so under LANG=fr_FR.UTF-8 every
# catalogue reported 0.0%; and it ignored msgfmt's exit code, so a .po that
# msgfmt could not read looked identical to a complete one. It also needed
# gettext on PATH, which Windows does not have by default. `check_translations`
# computes the same coverage in Python from the .po files, so all three go at
# once.
#
# An `i18n-status` alias of it used to live here. Cody removed it on 2026-11-05:
# two names for one command is redundant, and the two used different
# vocabularies (`i18n-*` against `*-messages`) while sitting in different theme
# files. `check-messages` is the one name.
