# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Tests
# ==========================================================================
#
# Anything with logic runs through `python -m poe_tasks <verb>` (poe_tasks/cli.py).
# A `cmd` task forwards whatever follows `--` to the command, so every task
# here takes pytest flags: `poe test -- -k foo`, `poe test-engine sqlite -- -k foo`,
# `poe test-gui-watch chromium -- -k test_x`. Only `test` declares no argument,
# so it alone also takes them without `--`.

[tasks.test]
help = "Run the suite; GUI tests are skipped unless you pass --run-selenium"
cmd = "pytest"


# `test-order` is the local half of .github/workflows/order-independence.yml,
# and `poe help` is the only place it is written down. That is deliberate: a
# check that exists only as a workflow file is a check nobody runs before
# pushing, and this one is meant to be run by a person who has decided a change
# deserves it. The workflow's header holds the policy.
#
# `-p randomly` is passed here rather than enabled for every run: `poe test`
# has to stay deterministic. What it catches is tests that depend on each
# other; it does not catch a test that depends on the order a *database*
# returns rows in, whose fix is an explicit `order_by`.
#
# Known: the suite does not pass shuffled yet. Measured 2026-10-19, seeds 1 and
# 2 each give 15 failures. So expect red, and read the failures rather than the
# count.
[tasks.test-order]
help = "Run the suite in a shuffled order, to catch tests that depend on each other"
cmd = "python -m poe_tasks test-order ${seed}"

[[tasks.test-order.args]]
name = "seed"
positional = true
required = false
help = "A seed from an earlier run, to replay that exact order"


# Swaps qatrack/local_test_settings.<engine>.py in for the run and restores
# your own file however the run ends, Ctrl-C included. It refuses to start if a
# .bak from a killed run is still present, because copying over it is the one
# way to lose the real settings.
#
# `--docker` folds the old `test-engine-docker` in: where the database server
# comes from is a parameter, not a different job. It starts the engine's
# throwaway container (deploy/dev/compose.test-databases.yaml), copies the
# shipped settings template into place if you have no copy of your own, and
# checks the driver is installed before anything starts. The container is left
# RUNNING afterwards, because the common case is running the suite again and
# paying SQL Server's start-up twice is the thing you would notice;
# `poe test-databases-down` stops them. sqlite and memory need no container.
[tasks.test-engine]
help = "Run the suite against one database engine, then restore your settings"
cmd = "python -m poe_tasks test-engine ${engine}"

[[tasks.test-engine.args]]
name = "engine"
positional = true
required = true
choices = ["sqlite", "memory", "postgres", "mysql", "mssql"]
help = "Engine; its qatrack/local_test_settings.<engine>.py must exist"

[[tasks.test-engine.args]]
name = "docker"
options = ["--docker"]
type = "boolean"
help = "Start the engine's throwaway Docker server first (postgres, mysql, mssql)"


# Provisions exactly the way a fresh deployment would (migrate, createcachetable,
# collectstatic, createsuperuser), so the whole sequence is exercised for real,
# then runs the suite with --reuse-db against that database. Refuses if your
# local_settings.py points anywhere but db/default.db, because the manage.py
# steps read those settings and would provision your real database.
[tasks.test-integration]
help = "Provision a fresh sqlite db like a deployment, then run the suite on it"
cmd = "python -m poe_tasks test-integration"


# ==========================================================================
# Tests - browser / GUI
# ==========================================================================
#
# Two axes, browser and window mode. The browser is a *parameter* and the mode
# is what you are choosing to do, which is why one is an argument and the other
# is the task name (Cody, 2026-11-05). Six tasks became three that way.
#
# OMITTING THE BROWSER USES YOURS. The argument has no default, so with none
# given the tasks leave SELENIUM_BROWSER alone and whatever
# local_test_settings.py (or your environment) says is what runs. Only the
# window mode is imposed. One asymmetry: settings.py reads SELENIUM_BROWSER from
# the environment and local_test_settings.py is imported afterwards, so a value
# pinned there beats the environment - and beats the argument too, with nothing
# said. If that bites, the fix is in live.py.
#
# `choices` rejects a browser the harness does not know and gives tab completion.
#
# These are `cmd` tasks, so pytest flags go after `--`:
# `poe test-gui-watch chromium -- -k test_schedule_report`. The mode tasks used
# to be bodies that discarded extras, which is why the developer guide once
# told you to call pytest by hand for one test; it no longer has to.

# WHY THIS EXISTS, given that it is exactly `uv run pytest -m selenium` and
# adds no behaviour. Cody decided to keep it, 2026-11-05: it is the only task
# here that overrides nothing, so it honours both halves of your own settings;
# and `poe` with no arguments is how someone finds out this project has a GUI
# suite at all - the plain case is also what CI runs. The full decision is in
# aviary, projects/qatrackplus/decisions/2026-11-05-poe-task-naming-and-test-gui.md.
[tasks.test-gui]
help = "Run only the GUI/Selenium tests, with whatever your settings configure"
cmd = "pytest -m selenium"


[tasks.test-gui-headless]
help = "Run only the GUI tests, with no window"
cmd = "python -m poe_tasks test-gui ${browser}"
env = { SELENIUM_HEADLESS = "True" }

[[tasks.test-gui-headless.args]]
name = "browser"
positional = true
choices = ["firefox", "chromium", "edge"]
help = "Browser to drive; omit to use your settings' choice"


[tasks.test-gui-visible]
help = "Run only the GUI tests in a real window; needs a display"
cmd = "python -m poe_tasks test-gui ${browser}"
env = { SELENIUM_HEADLESS = "False" }

[[tasks.test-gui-visible.args]]
name = "browser"
positional = true
choices = ["firefox", "chromium", "edge"]
help = "Browser to drive; omit to use your settings' choice"


# The supported way to watch a GUI run, and the only advertised interface to
# the pause: SELENIUM_SLOW_MO is read straight from the environment in live.py,
# so it cannot be left switched on in a settings file - and a settings file
# cannot override it either. A watched run is for looking at, not for
# measuring: pauses can let a race that fails at full speed pass here. The
# harness prints that warning itself.
[tasks.test-gui-watch]
help = "Watch a GUI run: visible and paused between actions; not for measuring"
cmd = "python -m poe_tasks test-gui ${browser}"
env = { SELENIUM_HEADLESS = "False", SELENIUM_SLOW_MO = "0.4" }

[[tasks.test-gui-watch.args]]
name = "browser"
positional = true
choices = ["firefox", "chromium", "edge"]
help = "Browser to drive; omit to use your settings' choice"
