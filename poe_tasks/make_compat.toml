# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# The Makefile way, under poe
#
# Every target in the Makefile has a `make-<target>` task here, and every one
# of them is listed in the generated command reference. That completeness is
# not a convention anyone has to remember: `docs/_ext/command_tables.py`
# raises on a target with no mirror, so the documentation build fails, and
# `test_every_makefile_target_has_a_mirror` asserts the same thing without
# needing Sphinx.
#
# **The Makefile itself is frozen.** An earlier commit on this branch reduced
# it to a file of aliases that forwarded to poe. Cody reversed that on
# 2026-11-05: the Makefile is not touched by this pull request at all, it is
# byte-identical to the one on `develop`, and **it is removed in the 4.1
# cycle** rather than rewritten now. So for as long as it exists there are two
# implementations - the Makefile's own, and poe's - and this file is how the
# two stay comparable: `poe make-<target>` is the Makefile's behaviour, and
# `poe <task>` is the cross-platform successor.
#
# Why that is a better trade than the aliases it replaces: an alias made the
# Makefile depend on poe, and `POE = uv run poe` in a recipe means a site that
# synced `--no-dev` pulls the whole dev group in the moment it runs one - crane
# measured 112 packages to 200 on Ubuntu 24.04. A frozen Makefile with no
# mention of poe in it cannot do that.
#
# **Nothing new belongs here.** A new task goes in one of the theme files, and
# gets a mirror only if the Makefile grows a target - which it will not,
# because it is on its way out. When it goes, this whole file goes with it in
# the same change. The mirrors do not count toward the task surface the
# ratchet in test_poe_tasks.py polices.
#
# **Most mirrors are a `ref`, and that is deliberate.** `make-test-integration`
# used to carry its own shell copy of the provisioning sequence and the five
# engine analogs shared a `_test-engine` shell task; both had drifted from the
# tasks they mirrored, and neither refused to overwrite a backup left by a
# killed run, so running one after an interruption destroyed the developer's
# database or settings. @nsmela reproduced both end to end on #868. A `ref`
# cannot drift. A `ref` also carries arguments to the task it names - measured
# with poe 0.49.0 - which is how four coverage mirrors share one `cover` task
# and how `poe make-cover-module qatrack/units` still works.
#
# **Extra pytest flags on a mirror go without `--`.** A caller's `--` is
# passed on literally through a `ref`, and pytest then reads what follows it as
# file arguments. So `poe make-test -k foo`, not `poe make-test -- -k foo`
# (the module behind the successor tasks strips one stray `--`, so either
# spelling works where the target is a `python -m poe_tasks` task).
#
# **Three mirrors refuse instead of running, and say why:** `make-schema`,
# because the target is retired in the Makefile itself (Cody, 2026-11-05: it
# wrote the diagram under a hardcoded version and exited 0 when the render
# failed); and `make-nginx-conf` and `make-supervisor-conf`, because the
# Makefile's versions install configs that `www-data` can write (crane,
# Ubuntu 24.04, 2026-11-04) and poe no longer carries the deployment helpers
# that used to stand in for them - those four tasks left the runner on
# 2026-11-06 for the pull request their own header promised, where they will
# be validated on a real host or dropped. A mirror that kept a withdrawn name
# working would leave the retirement half done. That is the shape every
# remaining broken target should take if one is found before the file is
# deleted: both runners refuse, and both name what to do instead.
#
# **A dot cannot survive the move.** poe validates task names against
# `^[^\W\d][\w:+-]*$` (`poethepoet/task/base.py`), which has no `.` in it;
# `make-nginx.conf` is refused with `Error: Invalid task` - measured, not
# inferred. So the two dotted targets lose the dot, and only those two names
# differ from `make-<target>`.
# ==========================================================================


# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------

[tasks.make-test]
help = "The suite, as `make test` runs it (GUI tests skipped)"
ref = "test"


# `make test_simple` has been identical to `make test` since the GUI tests
# started skipping by default (see conftest.py). The target is kept in the
# Makefile for scripts and muscle memory, so the mirror is kept too, and both
# point at the same place rather than at a copy.
[tasks.make-test_simple]
help = "The same as `make test`; kept because scripts still call it"
ref = "test"


[tasks.make-test-sqlite]
help = "The suite on local_test_settings.sqlite.py, as `make test-sqlite` does"
ref = "test-engine sqlite"


[tasks.make-test-memory]
help = "The suite on local_test_settings.memory.py, as `make test-memory` does"
ref = "test-engine memory"


[tasks.make-test-postgres]
help = "WIP: the suite on local_test_settings.postgres.py; needs a postgres server"
ref = "test-engine postgres"


[tasks.make-test-mysql]
help = "WIP: the suite on local_test_settings.mysql.py; needs a mysql server"
ref = "test-engine mysql"


[tasks.make-test-mssql]
help = "WIP: the suite on local_test_settings.mssql.py; needs a SQL Server"
ref = "test-engine mssql"


[tasks.make-test-integration]
help = "Provision a fresh sqlite db and test on it, as `make test-integration` does"
ref = "test-integration"


# --------------------------------------------------------------------------
# Coverage: four spellings of one task
# --------------------------------------------------------------------------

[tasks.make-cover]
help = "The suite with a coverage report, as `make cover` runs it"
ref = "cover"


[tasks.make-cover-qatrack]
help = "Coverage of the qatrack package only, as `make cover-qatrack` runs it"
ref = "cover qatrack"


[tasks.make-cover-mo]
help = "Coverage with fully-covered files left out, as `make cover-mo` runs it"
ref = "cover --skip-covered"


# `make cover-module module=qatrack/units` passes the module as a make
# variable; here it is the positional, so `poe make-cover-module qatrack/units`.
# One difference from the Makefile, and for the better: the successor passes
# --reuse-db like every other coverage run, which the Makefile's target forgot.
[tasks.make-cover-module]
help = "Coverage of one module: poe make-cover-module qatrack/units"
ref = "cover"


# --------------------------------------------------------------------------
# Documentation
# --------------------------------------------------------------------------

# This one is not a ref, because what it mirrors is the part that differs:
# `make docs` shells out to `docs/Makefile`, so it needs Make on the host -
# which is the whole reason the `docs` task calls sphinx-build directly. Anyone
# reaching for the Makefile way has Make, so the mirror can afford to need it.
[tasks.make-docs]
help = "Build the docs through docs/Makefile, as `make docs` does; needs make"
shell = '''
cd docs && make html
'''


# Not a ref either, and the difference is the port: the Makefile serves on
# 8009 and the `docs-serve` task on 8008. That disagreement is the kind of
# drift this file exists to make visible rather than to hide, and the
# documentation says 8008, so the successor is the one that is right. The
# mirror keeps 8009 because that is what `make docs-autobuild` does today.
[tasks.make-docs-autobuild]
help = "Serve the docs with live reload on port 8009, as `make docs-autobuild` does"
cmd = "sphinx-autobuild docs docs/_build/html --port 8009"


# --------------------------------------------------------------------------
# Data
# --------------------------------------------------------------------------

# Shell rather than a ref, because the two genuinely differ: the Makefile
# builds the timestamp with `date`, and the `dump-data` task builds it in
# Python so that it also works where `date` is not a command.
[tasks.make-dumpdata]
help = "Dump the database to a timestamped JSON fixture, as `make dumpdata` does"
shell = '''
python manage.py dumpdata -v1 --indent=2 --natural-foreign --natural-primary --output qatrack-dump-$(date '+%Y-%m-%d_%H-%M-%S').json
'''


# --------------------------------------------------------------------------
# Running
# --------------------------------------------------------------------------

[tasks.make-run]
help = "The development server, as `make run` starts it"
ref = "run"


# --------------------------------------------------------------------------
# Release and deployment - the three that refuse, and say what to do instead
# --------------------------------------------------------------------------
#
# The notices themselves are in poe_tasks/cli.py (RETIRED), so that the text
# is Python the linter sees rather than a body inside a TOML string.

[tasks.make-nginx-conf]
help = "RETIRED: installs a www-data-writable config; see docs/install/linux.rst"
cmd = "python -m poe_tasks retired make-nginx-conf"


[tasks.make-supervisor-conf]
help = "RETIRED: leaves user-owned supervisor configs; see docs/install/linux.rst"
cmd = "python -m poe_tasks retired make-supervisor-conf"


[tasks.make-schema]
help = "RETIRED: no longer regenerates the diagram; use `uv run poe schema`"
cmd = "python -m poe_tasks retired make-schema"
