# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Development environment
# ==========================================================================


# dev-init refuses to touch an environment that already exists, rather than
# copying what it can and failing partway through on `That username is already
# taken`. If a later step fails it removes what this run created, so the rerun
# is not refused by the half-made environment. If you want the old one gone,
# say so explicitly with dev-reset. The logic is `dev_init` in poe_tasks/cli.py.
[tasks.dev-init]
help = "Create a fresh sqlite dev environment - refuses if one already exists"
cmd = "python -m poe_tasks dev-init"


# Private: nobody chooses "clean, then nothing". It is the first half of
# dev-reset, which is the destructive job and is named as such.
[tasks._dev-clean]
help = "(internal) remove the dev settings files and sqlite database, leaving nothing behind"
cmd = "python -m poe_tasks dev-clean"


[tasks.dev-reset]
help = "DESTRUCTIVE: delete your dev settings and sqlite database, then set up a fresh one"
sequence = ["_dev-clean", "dev-init"]


[tasks.run]
help = "Run the dev server"
cmd = "python ./manage.py runserver"
