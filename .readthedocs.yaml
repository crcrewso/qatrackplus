# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs: 
    pre_create_environment:
      - asdf plugin add uv
      # Pinned rather than `latest`: uv's resolver behaviour changes between
      # releases, and an unpinned docs toolchain can start failing (or start
      # resolving differently) with no change on our side. Keep in step with
      # the `version:` pinned for setup-uv in .github/workflows/ci.yml.
      - asdf install uv 0.12.5
      - asdf global uv 0.12.5
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --group dev

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py

