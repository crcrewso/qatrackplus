name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-Commit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Setup Database configuration
        run: cp deploy/sqlite/local_settings.py qatrack/local_settings.py
      - name: Run pre-commit
        run: uvx pre-commit@4.6.0 run --all-files

  requirements:
    name: Requirements Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install system dependencies for python-ldap
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --locked
      - name: Check dependencies
        run: uv pip check

  linux-tests:
    name: Linux Tests
    runs-on: ubuntu-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        db: [memory, sqlite, postgres, mysql]
    
    services:
      postgres:
        image: postgres@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_DB: qatrackplus
          POSTGRES_USER: qatrack
          POSTGRES_PASSWORD: qatrackpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Memory SQLite)
        if: matrix.db == 'memory'
        run: uv sync --locked

      - name: Install dependencies (SQLite)
        if: matrix.db == 'sqlite'
        run: uv sync --locked

      - name: Install dependencies (Postgres)
        if: matrix.db == 'postgres'
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          uv sync --extra postgres --locked

      - name: Install dependencies (MySQL)
        if: matrix.db == 'mysql'
        run: |
          sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
          uv sync --extra mysql --locked

      - name: Activate virtual environment
        # Puts .venv/bin on PATH for every later step in this job, so they
        # can call `pytest`/`python` directly instead of prefixing each
        # with `uv run` (which re-checks the venv against the lockfile
        # every time - redundant right after `uv sync` just ran above).
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # No "Setup Database configuration (Memory SQLite)" step here on
      # purpose: settings.py falls back to a disposable in-memory SQLite
      # database when qatrack/local_settings.py is absent under pytest
      # (see qatrack/settings.py) - faster than a real file-based sqlite
      # db, and doubles as real-world coverage of that fallback itself,
      # on a genuinely different environment than any local dev machine.
      # The separate "sqlite" matrix entry below covers the real,
      # file-based sqlite3 backend instead - the two aren't redundant,
      # since a real file-backed db exercises file I/O and on-disk
      # locking behaviour the in-memory fallback never touches.

      - name: Setup Database configuration (SQLite)
        if: matrix.db == 'sqlite'
        run: cp deploy/sqlite/local_settings.py qatrack/local_settings.py

      - name: Setup Database configuration (Postgres)
        if: matrix.db == 'postgres'
        run: |
          cp deploy/postgres/local_settings.py qatrack/local_settings.py
          sed -i "s/'HOST': ''/'HOST': '127.0.0.1'/g" qatrack/local_settings.py
          # User qatrack is already created with full privileges by the service container

      - name: Setup Database configuration (MySQL)
        if: matrix.db == 'mysql'
        run: |
          cp deploy/mysql/local_settings.py qatrack/local_settings.py
          sed -i "s/'HOST': ''/'HOST': '127.0.0.1'/g" qatrack/local_settings.py
          # Setup mysql users and privileges for MySQL 8 compat
          docker exec -i ${{ job.services.mysql.id }} mysql -u root -proot -e "CREATE USER 'qatrack'@'%' IDENTIFIED WITH mysql_native_password BY 'qatrackpass'; CREATE USER 'qatrack_reports'@'%' IDENTIFIED WITH mysql_native_password BY 'qatrackpass'; CREATE DATABASE qatrackplus CHARACTER SET utf8mb4; GRANT ALL ON qatrackplus.* TO 'qatrack'@'%'; GRANT ALL ON test_qatrackplus.* TO 'qatrack'@'%'; GRANT SELECT ON qatrackplus.* TO 'qatrack_reports'@'%'; FLUSH PRIVILEGES;"
          docker exec -i ${{ job.services.mysql.id }} sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -u root -proot mysql"

      - name: Run Tests
        run: pytest -x

  windows-tests:
    name: Windows Tests
    runs-on: windows-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mssql]
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.12"
          
      - name: Install dependencies (SQLite)
        if: matrix.db == 'sqlite'
        run: uv sync --extra win --locked
        
      - name: Install dependencies (MSSQL)
        if: matrix.db == 'mssql'
        run: uv sync --extra win --extra mssql --locked
        
      - name: Setup Database configuration (SQLite)
        if: matrix.db == 'sqlite'
        run: copy deploy\sqlite\local_settings.py qatrack\local_settings.py
        
      - name: Setup Database configuration (MSSQL)
        if: matrix.db == 'mssql'
        uses: Particular/install-sql-server-action@669fc7147c13cb314685bab823a55a5e22a0c95f
        with:
          catalog: qatrackplus
          connection-string-env-var: SQL_CONNECTION_STRING

      - name: Configure MSSQL local_settings.py
        if: matrix.db == 'mssql'
        run: |
          $code = @"
          import os
          conn_str = os.environ.get('SQL_CONNECTION_STRING', '')
          parts = dict(part.split('=', 1) for part in conn_str.split(';') if '=' in part)
          db_settings = {
              'ENGINE': 'mssql',
              'NAME': parts.get('Database', parts.get('Initial Catalog', 'qatrackplus')),
              'HOST': parts.get('Server', parts.get('Data Source', r'localhost\SQLEXPRESS')),
              'PORT': '',
              'OPTIONS': {
                  'driver': 'ODBC Driver 17 for SQL Server',
              },
          }
          if 'User Id' in parts and 'Password' in parts:
              db_settings['USER'] = parts['User Id']
              db_settings['PASSWORD'] = parts['Password']
          elif 'Uid' in parts and 'Pwd' in parts:
              db_settings['USER'] = parts['Uid']
              db_settings['PASSWORD'] = parts['Pwd']
          else:
              db_settings['OPTIONS']['extra_params'] = 'Trusted_Connection=yes'
          with open('qatrack/local_settings.py', 'w', encoding='utf8') as f:
              f.write('DEBUG = False\n')
              f.write('DATABASES = { "default": ' + repr(db_settings) + ' }\n')
              f.write('DATABASES["readonly"] = DATABASES["default"]\n')
          "@
          $code | Out-File -FilePath generate_settings.py -Encoding utf8
          python generate_settings.py
      - name: Run Tests
        run: uv run pytest -x

  docker-check:
    name: Docker Build & Run Check
    runs-on: ubuntu-latest
    needs: [lint, requirements]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Docker Compose
        run: sudo apt-get update && sudo apt-get install docker-compose -y

      - name: Build Docker Images
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          # .env.example ships with a permissive ALLOWED_HOSTS=* for ease of
          # local/dev setup, but this smoke test is meant to reflect a real
          # deployment, so tighten it to exactly what CI will curl against.
          # (DEBUG is not read from the environment in the Docker settings
          # path — it's hardcoded False — so it's already production-like
          # and needs no override here.)
          #
          # This also matters beyond the Host-header check below:
          # .env.example leaves CSRF_TRUSTED_ORIGINS unset, so settings.py
          # derives it from ALLOWED_HOSTS (skipping any literal "*" entry -
          # see qatrack/settings.py's use_docker block). Left at the
          # wildcard default, that derivation would produce an *empty*
          # CSRF_TRUSTED_ORIGINS, and any form POST in the HTTP smoke test
          # below (e.g. a login) would fail CSRF validation outright, for a
          # reason unrelated to whatever the test was actually checking.
          # Tightening ALLOWED_HOSTS here fixes that as a side effect.
          sed -i 's/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=localhost,127.0.0.1/' .env
          docker compose -f compose.yaml build

      - name: Fix script permissions
        run: chmod +x deploy/docker/django/entrypoint.sh

      - name: Start Docker Containers
        working-directory: deploy/docker
        run: docker compose -f compose.yaml up -d

      - name: Check Running Containers
        run: |
          docker ps -a
          # Optionally sleep for a few seconds to ensure containers don't immediately crash
          sleep 10
          
      - name: Check Container Logs for Errors (Optional)
        working-directory: deploy/docker
        run: docker compose -f compose.yaml logs

      - name: Verify Application is Up (Optional health check)
        # Check if the Django app container remains 'Up' and didn't exit or become unhealthy
        run: |
          if [ $(docker ps -q -f status=exited | wc -l) -gt 0 ]; then
            echo "One or more containers exited unexpectedly!"
            docker ps -a
            exit 1
          fi
          if [ $(docker ps -q -f health=unhealthy | wc -l) -gt 0 ]; then
            echo "One or more containers are unhealthy!"
            docker ps -a
            exit 1
          fi

      - name: Verify backup produces a valid dump
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          docker compose -f compose.yaml exec -T backup sh -eu -c '
            rm -f /backups/db_*.dump /backups/media_*.tar.gz 2>/dev/null || true

            # Run the backup exactly as the nightly cron job does.
            bash /backup.sh

            dump=$(ls -1t /backups/db_*.dump 2>/dev/null | head -1 || true)
            [ -n "$dump" ] || { echo "FAIL: no db dump produced"; exit 1; }

            size=$(stat -c %s "$dump")
            echo "dump=$dump size=$size"
            [ "$size" -gt 0 ] || { echo "FAIL: db dump is 0 bytes (auth failed)"; exit 1; }

            # Prove it is a real pg_dump archive, not just non-empty.
            pg_restore --list "$dump" >/dev/null || { echo "FAIL: not a valid archive"; exit 1; }

            # Media archive must also be produced.
            ls -1 /backups/media_*.tar.gz >/dev/null || { echo "FAIL: media archive missing"; exit 1; }

            echo "PASS: valid db dump + media archive produced"
          '

      - name: Run Docker-Tagged Test Subset
        # A small, curated subset of tests (tagged `docker`) that spans
        # several apps superficially, avoiding anything DB-engine-specific
        # or dependent on optional extras not installed in this image
        # (e.g. ldap). Uses manage.py's built-in test runner, not pytest —
        # pytest isn't installed in the runtime image. This verifies
        # application code under the Docker runtime; it does not verify
        # the deployment is wired together correctly, which is what the
        # HTTP smoke test below is for.
        working-directory: deploy/docker
        run: docker compose -f compose.yaml exec -T django python manage.py test --tag=docker

      - name: HTTP Smoke Test
        # Verifies the deployment is actually wired together end-to-end,
        # hitting it the same way a real client would (through nginx on
        # its exposed port, not django's own internal healthcheck). The
        # nginx <-> django proxy and static-file serving are covered
        # continuously by nginx's own healthcheck (see compose.yaml) and
        # were already confirmed non-unhealthy above, so this only checks
        # what that healthcheck doesn't:
        run: |
          set -e
          # Media location is wired up (nginx reaches the mounted volume) -
          # not checking for a specific file since a fresh install has none;
          # just confirming nginx doesn't 502/504 on it.
          MEDIA_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/media/)
          [ "$MEDIA_CODE" -lt 500 ] || (echo "Media location check failed: got $MEDIA_CODE" && exit 1)

          # ALLOWED_HOSTS is actually enforced, not just configured - a
          # mismatched Host header should be rejected (400), proving this
          # deployment behaves like production rather than the permissive
          # ALLOWED_HOSTS=* that ships in .env.example for local/dev use.
          SPOOFED_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.example.com" http://localhost/)
          [ "$SPOOFED_CODE" = "400" ] || (echo "Expected ALLOWED_HOSTS to reject an unknown Host header with 400, got $SPOOFED_CODE" && exit 1)

      - name: Tear Down
        if: always()
        working-directory: deploy/docker
        run: docker compose -f compose.yaml down -v

  selenium-tests:
    name: Selenium Tests
    runs-on: ubuntu-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chromium]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Activate virtual environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # No local_settings.py here either: same in-memory SQLite fallback as
      # the Linux Tests (memory) job. Chrome/Chromium and Firefox, with
      # matching drivers, come pre-installed on GitHub's ubuntu-latest
      # runner - no browser/driver install step needed. Runs the Selenium
      # suite only (bypasses the skip-by-default via -m selenium), against
      # one browser per matrix entry, headless (this branch's default).
      - name: Run Selenium Tests
        env:
          SELENIUM_BROWSER: ${{ matrix.browser }}
        run: pytest -m selenium

      # conftest.py writes a screenshot of the browser for each Selenium test
      # that fails, and nothing at all when they pass. Collecting them here is
      # the point of the feature: a GUI failure that only happens on CI leaves
      # no other record of what the page actually looked like.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selenium-screenshots-linux-${{ matrix.browser }}
          path: selenium-screenshots/
          if-no-files-found: ignore

  selenium-tests-windows:
    name: Selenium Tests (Windows)
    runs-on: windows-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "0.12.5"
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra win --locked

      # No local_settings.py here either: same in-memory SQLite fallback as
      # the Linux jobs. Chrome/Chromium (and Firefox and Edge) come
      # pre-installed on GitHub's windows-latest runner - no browser/driver
      # install step needed. Runs the Selenium suite only (bypasses the
      # skip-by-default via -m selenium), headless (this branch's
      # default).
      - name: Run Selenium Tests
        env:
          SELENIUM_BROWSER: ${{ matrix.browser }}
        run: uv run pytest -m selenium

      # conftest.py writes a screenshot of the browser for each Selenium test
      # that fails, and nothing at all when they pass. Collecting them here is
      # the point of the feature: a GUI failure that only happens on CI leaves
      # no other record of what the page actually looked like.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: selenium-screenshots-windows-${{ matrix.browser }}
          path: selenium-screenshots/
          if-no-files-found: ignore
